{% comment %}
One form field. Replaces crispy-forms.

    {% include "ui/field.html" with field=form.name %}
{% endcomment %}
<div class="flex flex-col gap-1.5">
  <label for="{{ field.id_for_label }}"
         class="font-mono text-[10px] font-medium uppercase tracking-wider text-muted">
    {{ field.label }}{% if field.field.required %}<span class="text-state-suspended"> *</span>{% endif %}
  </label>

  {{ field }}

  {% if field.help_text %}
    <p class="text-xs text-muted">{{ field.help_text }}</p>
  {% endif %}

  {% for error in field.errors %}
    <p class="text-xs text-state-suspended">{{ error }}</p>
  {% endfor %}
</div>
